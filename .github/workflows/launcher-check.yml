name: Launcher checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: TTS проект
    steps:
      - uses: actions/checkout@v4
        with:
          path: TTS проект
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Windows entry point
        if: runner.os == 'Windows'
        shell: cmd
        run: START-WINDOWS.cmd --check
      - name: Check macOS entry point
        if: runner.os == 'macOS'
        run: ./START-MACOS.command --check
      - name: Test launcher behavior
        run: python -m unittest discover -s tests -v
